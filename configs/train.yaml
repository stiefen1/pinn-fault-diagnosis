# Draft training overlay config.
#
# Intended usage:
# 1) Load configs/base.yaml first (shared settings).
# 2) Merge this file on top for training-specific behavior.
#
# Example merge order in your loader:
#   base.yaml -> train.yaml

config:
  base: configs/base.yaml

project:
  mode: train
  experiment_name: train_demo
  tags: [pinn, fault-diagnosis, train]

io:
  resume_from: null # runs/train_demo/checkpoints/best.pt
  checkpoint_dir: checkpoints/
  save_every_n_epochs: 10
  keep_last_k: 3
  log_every_n_steps: 0

  # TensorBoard-only logging.
  logging:
    enabled: true
    log_dir: tb_logs/train_demo
    flush_secs: 30

dataset:
  train_path: 
    - data/train/fault_identification_dataset.npz
    - data/train/fault_identification_dataset_50_nmpc.npz
    - data/train/fault_identification_dataset_50_random.npz
    - data/train/fault_identification_dataset_500_random.npz
  val_path: data/validation/fault_identification_dataset.npz
  features:
    n_samples: 100
    target_mode: ema # instant | ema -> instant means we take theta at last time step as target. Exponential moving average (EMA) enables to use a weighted average of theta along the window instead
    ema_alpha: 0.1 # Used when target_mode is ema; larger values respond faster.


  loading:
    shuffle_train: true
    shuffle_val: false
    shuffle_test: false
    drop_last_train: true

  batch:
    train_batch_size: 256
    val_batch_size: 512
    test_batch_size: 512
    num_workers: 4
    persistent_workers: true
    prefetch_factor: 4

model:
  # name: MLPFaultEstimator
  # architecture:
  #   hidden_layers: [256, 128, 64]
  #   activation:
  #     name: relu # relu | tanh | gelu | silu | leaky_relu
  #   output_activation:
  #     name: sigmoid # To have theta \in [0, 1]
  #   dropout: 0.1
  #   layer_norm: true
  #   batch_norm: true
  name: CNNFaultEstimator
  architecture:
    conv_channels: [4, 8]
    kernel_size: [12, 6]
    padding: [0, 0]
    hidden_layers: [64, 32]
    activation:
      name: relu # relu | tanh | gelu | silu | leaky_relu
    output_activation:
      name: sigmoid # To have theta \in [0, 1]
    dropout: 0.1
    layer_norm: true
    batch_norm: true

train:
  max_epochs: 1000
  grad_clip_norm: 1.0

  early_stopping:             # stop training if validation stopped improving
    enabled: true
    patience: 50              # number of epochs without improvement before stopping
    min_delta: 1.0e-6         # improvement must be at least greater than this value

loss:
  supervised:                 # regularization is handled by the optimizer
    name: mse                 # mse | mae | huber
    huber_delta: 1.0

  # physics:                  # TODO: Implement a physics loss
  #   name: mse
  #   huber_delta: 1.0

optimizer:
  name: adamw                 # adam | adamw | sgd
  lr: 1.0e-4 # 1.0e-3
  weight_decay: 1.0e-4

  scheduler:                  # step | cosine_annealing | exp
    enabled: true
    name: cosine_annealing
    last_epoch: -1
    eta_min: 1.0e-6

device: cuda

hpc:
  partition: GPUQ           # GPUQ | CPUQ
  time: "12:00:00" 
  ntasks: 1
  nodes: 1
  cpus_per_task: 10
  gpus: 1
  mem: 64G

  slurm_script:
    output_dir: slurm_files/
    job_name: demo_array

  environment:
    modules:
      - Miniconda3/24.7.1-0
    conda_env: pinn-fault-diagnosis

  array:
    enabled: true
    params: # Launch one training for each combination of parameters
      optimizer.lr: [0.0001, 0.0002, 0.0004, 0.0008, 0.0016, 0.0032, 0.0064]      

  launcher:
    kind: python
    command: python -m src.train -c configs/train.yaml
