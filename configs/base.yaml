# Draft shared base configuration.
#
# This file should contain only settings that are common across
# train/validate/test overlays.

project:
  name: pinn-fault-diagnosis
  task: fault_estimation
  output_root: runs/
  experiment_name: default
  tags: [pinn, fault-diagnosis]

dataset:
  features:
    nx: 18
    nu: 6
    ntheta: 6
    n_samples: 1

io:
  resume_from: null
  checkpoint_dir: checkpoints/
  save_every_n_epochs: 10
  keep_last_k: 3
  log_every_n_steps: 0

  # TensorBoard-only logging.
  logging:
    enabled: true
    log_dir: tb_logs/default
    flush_secs: 30

seed:
  global: 42
  deterministic: false
  torch:
    benchmark: true

hardware:
  device: cuda                # cuda | cpu
  gpus: 1
  gpu_ids: [0]
  num_nodes: 1

  dataloader_workers_per_gpu: 8
  set_float32_matmul_precision: high  # highest | high | medium

hpc:
  partition: CPUQ           # GPUQ | CPUQ
  time: "12:00:00" 
  ntasks: 1
  nodes: 1
  cpus_per_task: 10
  gpus: 0
  mem: 32G

  slurm_script:
    enabled: false # Launch done through a slurm file
    output_dir: slurm_files/
    job_name: demo_array

  environment:
    modules:
      - Miniconda3/24.7.1-0
    conda_env: pinn-fault-diagnosis

  array:
    enabled: false

  slurm_script:
    enabled: true # Launch done through a slurm file
    output_dir: slurm_logs/
    job_name: pinns
    # extra_sbatch_args:
    #   - "--constraint=a100|h100"
    #   - "--exclusive"

notes:
  - Shared defaults for train/validate/test overlays.
  - Keep mode-specific changes in overlay files (train.yaml, validate.yaml, test.yaml).
