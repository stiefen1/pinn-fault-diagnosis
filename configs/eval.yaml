# Draft evaluation overlay config.
#
# Intended usage:
# 1) Load configs/base.yaml first (shared settings).
# 2) Merge this file on top for eval-specific behavior.
#
# Example merge order in your loader:
#   base.yaml -> eval.yaml

config:
  base: configs/base.yaml

dataset:
  save_dir: runs/eval_demo

diagnosis:
  algorithms:
    # pf:
    #   name: ParticleFilterFaultDiagnosis
    #   kwargs:
    #     n_particles: 200
    # ekf:
    #   name: EKFFaultDiagnosis
    #   kwargs: {}
    # mhe:
    #   name: MHEFaultDiagnosis
    #   kwargs:
    #     horizon: 100
    # pem:
    #   name: PEMFaultDiagnosis
    #   kwargs: {}
    nn: # This structure is a bit stupid (:
    #   name: MLPFaultDiagnosis
    #   kwargs:
    #     cfg:
    #       model: 
    #         name: MLPFaultEstimator
    #         architecture:
    #           hidden_layers: [256, 128, 64]
    #           activation:
    #             name: relu # relu | tanh | gelu | silu | leaky_relu
    #           output_activation:
    #             name: sigmoid
    #       dataset:
    #         features:
    #           nu: 6
    #           ny: 9
    #           n_samples: 50
    #           ntheta: 6
    #       io:
    #         resume_from: "Z:/dev/pinn-fault-diagnosis/runs/train_demo/checkpoints/best.pt"
      name: CNNFaultDiagnosis
      kwargs:
        cfg:
          model: 
            name: CNNFaultEstimator
            architecture:
              conv_channels: [4, 8]
              kernel_size: [12, 6]
              padding: [0, 0]
              hidden_layers: [64, 32]
              activation:
                name: relu # relu | tanh | gelu | silu | leaky_relu
              output_activation:
                name: sigmoid # To have theta \in [0, 1]
              dropout: 0.1
              layer_norm: true
              batch_norm: true
          dataset:
            features:
              nu: 6
              ny: 9
              n_samples: 100
              ntheta: 6
          io:
            resume_from: "runs/train_demo/checkpoints/best.pt"


project:
  mode: eval
  experiment_name: eval_demo
  tags: [pinn, fault-diagnosis, train]

episodes:
  N: 5 # number of episodes to build the dataset
  max_steps_per_episode: 500 # total number of simulation steps for a single episode
  num_workers: 8 # number of parallel CPU workers (1 = sequential)  n_sim: 100 # How many simulations
  metrics:
    tracking: [RMSE, IAE, ITAE, SE, AE]
    diagnosis: [MAE, RMSE, STD, IAE, ITAE]

device: cuda

env: # Configuration of evaluation environment
  dt: 0.2
  seed: 24
  render: false

  vessel:
    dp_mode: false
    desired_speed:
      min: 0.1
      max: 1.0

    faults:
      loss_of_effectiveness:
        prob: [1.0, 1.0, 0]
        amplitude:
          min: 0
          max: 1.0
          mean: 0.5 # uniform distribution if only min and max are provided, othewise clipped gaussian
          std: 0.3
        time:
          min: 0.0
          max: 1.0
          mean: 0.5
          std: 0.2

      azimuth_stucked:
        prob: [0, 0, 0] # Currently no fault
        is_integer: true # fault parameter can only be 0 or 1
        amplitude:
          mean: 0.5
          std: 0.2
        time:
          min: 0.0
          max: 1.0
          mean: 0.5
          std: 0.2

    diagnosis:
      enabled: true
      name: ParticleFilterFaultDiagnosis  # placeholder — overridden per algorithm by the arena
      kwargs: {}
    
    guidance:
      d_tot: 500
      max_turn_deg: 80.0
      seg_len_range: [10, 15]
      smooth_radius: 10
      start: [0, 0] # North, East
      desired_speed: 0.5

    navigation:
      enabled: true
      perfect_meas: false # bypass everything else to return noise-less states if true
      meas_cov:
        min:
          - 1e-3
          - 1e-3
          - 0.00035
          - 5e-3
          - 5e-3
          - 5e-3
          - 0.00314159
          - 0.00314159
          - 0.00314159
        max:
          - 1e-2
          - 1e-2
          - 0.0035
          - 5e-2
          - 5e-2
          - 5e-2
          - 0.0314159
          - 0.0314159
          - 0.0314159

    control:
      enabled: true
      horizon: 40

  wind:
    angle:
      ornstein_uhlenbeck:
        average:
          min: -3.14159
          max: 3.14159
        attraction: 0.03
        amplitude: 0.05
    speed:
      ornstein_uhlenbeck:
        average:  
          min: 0.0
          max: 5.0
        attraction: 0.03
        amplitude: 0.1

  current:
    angle:
      ornstein_uhlenbeck:
        average: 
          min: -3.14159
          max: 3.14159
        attraction: 0.03
        amplitude: 0.01
    speed:
      ornstein_uhlenbeck:
        average:
          min: 0.0
          max: 0.1
        attraction: 0.01
        amplitude: 0.1

hpc:
  partition: GPUQ           # GPUQ | CPUQ
  time: "12:00:00" 
  ntasks: 1
  nodes: 1
  cpus_per_task: 10
  gpus: 1
  mem: 64G

  slurm_script:
    output_dir: slurm_files/
    job_name: demo_array

  environment:
    modules:
      - Miniconda3/24.7.1-0
    conda_env: pinn-fault-diagnosis

  array:
    enabled: true
    params: # Launch one training for each combination of parameters
      optimizer.lr: [0.0001, 0.0002, 0.0004, 0.0008, 0.0016, 0.0032, 0.0064]      

  launcher:
    kind: python
    command: python -m src.eval -c configs/eval.yaml